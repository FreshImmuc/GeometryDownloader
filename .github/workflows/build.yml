name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask requests yt-dlp imageio-ffmpeg pyinstaller

      - name: Build EXE
        run: pyinstaller GeometryDownloader.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDownloader
          path: dist/GeometryDownloader.exe
          retention-days: 30
