name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install flask requests yt-dlp pyinstaller

      - name: Download ffmpeg + ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-extracted"
          $folder = Get-ChildItem -Path "ffmpeg-extracted" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "ffmpeg-bin" | Out-Null
          Copy-Item "$($folder.FullName)\bin\ffmpeg.exe" "ffmpeg-bin\"
          Copy-Item "$($folder.FullName)\bin\ffprobe.exe" "ffmpeg-bin\"

      - name: Build EXE
        run: pyinstaller GeometryDownloader.spec --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDownloader
          path: dist/GeometryDownloader.exe
          retention-days: 30
