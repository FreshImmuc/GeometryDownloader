<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Song Downloader</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --panel-2: #0a0e13;
            --border: #21262d;
            --accent: #e94560;
            --accent-soft: rgba(233, 69, 96, 0.18);
            --text: #e6edf3;
            --muted: #8b949e;
            --info: #79b8ff;
            --success: #56d364;
            --error: #ff7b72;
            --warn: #f0c674;
            --progress: #79b8ff;
        }

        * { box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        body {
            background-image:
                radial-gradient(1200px 600px at 80% -10%, rgba(233, 69, 96, 0.08), transparent 60%),
                radial-gradient(900px 500px at 0% 100%, rgba(121, 184, 255, 0.06), transparent 60%);
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 36px 20px 60px;
        }

        h4 {
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.4px;
            margin: 0 0 20px;
            text-align: center;
            font-size: 22px;
        }
        h4 .accent { color: var(--accent); }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }

        /* Tabs */
        .nav-tabs {
            border: none;
            display: flex;
            gap: 4px;
            margin-bottom: 18px;
            background: var(--panel-2);
            padding: 4px;
            border-radius: 8px;
        }
        .nav-tabs .nav-item { flex: 1; }
        .nav-tabs .nav-link {
            color: var(--muted);
            border: none;
            border-radius: 6px;
            text-align: center;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .nav-tabs .nav-link:hover {
            color: var(--text);
            background: rgba(255,255,255,0.03);
        }
        .nav-tabs .nav-link.active {
            background: var(--panel);
            color: var(--text);
            box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
        }

        label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }
        .form-control {
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .form-control:focus {
            background: var(--panel-2);
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-text { color: var(--muted); font-size: 12px; }

        .btn {
            border-radius: 6px;
            font-weight: 500;
            padding: 10px 14px;
            font-size: 14px;
            transition: transform 0.08s ease, background 0.18s ease, opacity 0.18s ease;
            border: none;
        }
        .btn:active { transform: scale(0.985); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #ff5778; color: #fff; }
        .btn-primary:disabled { opacity: 0.55; }
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: #30363d; }

        /* Terminal */
        .terminal {
            margin-top: 22px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
        }
        .term-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }
        .term-dots { display: flex; gap: 6px; }
        .term-dots span {
            width: 10px; height: 10px; border-radius: 50%;
            background: #30363d;
        }
        .term-dots span:nth-child(1) { background: #ff5f57; }
        .term-dots span:nth-child(2) { background: #febc2e; }
        .term-dots span:nth-child(3) { background: #28c840; }
        .term-title {
            font-size: 12px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            letter-spacing: 0.4px;
        }
        .term-status {
            margin-left: auto;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .term-status .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(86, 211, 100, 0.7);
            animation: pulse 1.6s ease-in-out infinite;
        }
        .term-status[data-busy="true"] .dot {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-soft);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .term-body {
            height: 280px;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            scroll-behavior: smooth;
        }
        .term-body::-webkit-scrollbar { width: 8px; }
        .term-body::-webkit-scrollbar-track { background: transparent; }
        .term-body::-webkit-scrollbar-thumb {
            background: #21262d;
            border-radius: 4px;
        }
        .term-body::-webkit-scrollbar-thumb:hover { background: #30363d; }

        .log-line {
            display: flex;
            gap: 12px;
            padding: 1px 0;
            white-space: pre-wrap;
            word-break: break-word;
            animation: lineEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1) backwards;
            will-change: transform, opacity;
        }
        @keyframes lineEnter {
            from {
                opacity: 0;
                transform: translate3d(-4px, -2px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        .log-ts {
            color: #4d5566;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.4s ease;
        }
        .log-msg { transition: color 0.5s ease; }

        .log-line[data-level="info"] .log-msg { color: var(--text); }
        .log-line[data-level="success"] .log-msg { color: var(--success); }
        .log-line[data-level="error"] .log-msg { color: var(--error); }
        .log-line[data-level="warn"] .log-msg { color: var(--warn); }
        .log-line[data-level="progress"] .log-msg { color: var(--progress); }
        .log-line[data-level="header"] .log-msg {
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.4px;
        }
        .log-line[data-level="header"] {
            margin-top: 6px;
            padding-top: 4px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--text);
            margin-left: 2px;
            vertical-align: -2px;
            animation: blink 1s steps(2) infinite;
            opacity: 0.6;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .stop-row { margin-top: 14px; }
    </style>
</head>
<body>

<div class="wrap">
    <h4>GD Song <span class="accent">Downloader</span></h4>

    <div class="panel">
        <ul class="nav nav-tabs" id="modeTab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#newgrounds" role="tab">Newgrounds</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#youtube" role="tab">YouTube</a>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="newgrounds" role="tabpanel">
                <form id="ng-form">
                    <div class="form-group">
                        <label>Newgrounds Song ID</label>
                        <input type="text" class="form-control" name="song_id" placeholder="e.g. 1234567" autocomplete="off" required>
                        <small class="form-text">The number in the Newgrounds audio URL.</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" data-label="Download Song">Download Song</button>
                </form>
            </div>

            <div class="tab-pane fade" id="youtube" role="tabpanel">
                <form id="yt-form">
                    <div class="form-group">
                        <label>YouTube URL</label>
                        <input type="text" class="form-control" name="youtube_url"
                               placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label>Save as Song ID</label>
                        <input type="text" class="form-control" name="song_id"
                               placeholder="e.g. 9999999" autocomplete="off" required>
                        <small class="form-text">Any unused number — GD uses this to find the file.</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" data-label="Download as Audio">Download as Audio</button>
                </form>
            </div>
        </div>
    </div>

    <div class="terminal">
        <div class="term-head">
            <div class="term-dots"><span></span><span></span><span></span></div>
            <div class="term-title">downloader.log</div>
            <div class="term-status" id="term-status" data-busy="false">
                <span class="dot"></span><span id="term-status-text">idle</span>
            </div>
        </div>
        <div class="term-body" id="term-body">
            <div class="log-line" data-level="info">
                <span class="log-ts">--:--:--</span>
                <span class="log-msg">Ready. Connecting to log stream<span class="cursor"></span></span>
            </div>
        </div>
    </div>

    <div class="stop-row">
        <button id="shutdown-btn" class="btn btn-ghost btn-block btn-sm">Stop the Downloader</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
(function () {
    const term = document.getElementById('term-body');
    const statusEl = document.getElementById('term-status');
    const statusText = document.getElementById('term-status-text');
    const buttons = document.querySelectorAll('button[data-label]');

    function ts(epoch) {
        const d = epoch ? new Date(epoch * 1000) : new Date();
        return d.toLocaleTimeString('en-GB', { hour12: false });
    }

    function isAtBottom() {
        return term.scrollTop + term.clientHeight >= term.scrollHeight - 24;
    }

    function smoothScrollToBottom() {
        const target = term.scrollHeight - term.clientHeight;
        const start = term.scrollTop;
        const dist = target - start;
        if (Math.abs(dist) < 1) return;
        const dur = Math.min(280, 80 + Math.abs(dist) * 0.5);
        const t0 = performance.now();
        function step(now) {
            const p = Math.min(1, (now - t0) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            term.scrollTop = start + dist * eased;
            if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function addLine(text, level, t) {
        level = level || 'info';
        const last = term.lastElementChild;

        if (level === 'progress' && last && last.dataset.level === 'progress') {
            last.querySelector('.log-msg').textContent = text;
            last.querySelector('.log-ts').textContent = ts(t);
            return;
        }

        // Strip the placeholder cursor on first real line
        const cursor = term.querySelector('.cursor');
        if (cursor) cursor.remove();

        const line = document.createElement('div');
        line.className = 'log-line';
        line.dataset.level = level;

        const tsSpan = document.createElement('span');
        tsSpan.className = 'log-ts';
        tsSpan.textContent = ts(t);

        const msgSpan = document.createElement('span');
        msgSpan.className = 'log-msg';
        msgSpan.textContent = text;

        line.appendChild(tsSpan);
        line.appendChild(msgSpan);

        const wasAtBottom = isAtBottom();
        term.appendChild(line);

        while (term.children.length > 250) {
            term.removeChild(term.firstChild);
        }

        if (wasAtBottom) {
            requestAnimationFrame(smoothScrollToBottom);
        }
    }

    function setBusy(busy) {
        statusEl.dataset.busy = busy ? 'true' : 'false';
        statusText.textContent = busy ? 'working' : 'idle';
        buttons.forEach(b => {
            b.disabled = busy;
            b.textContent = busy ? 'Working...' : b.dataset.label;
        });
    }

    function connectLogs() {
        const es = new EventSource('/api/logs');
        es.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.msg === '__DONE__') { setBusy(false); return; }
                addLine(data.msg, data.level, data.t);
            } catch (_) {}
        };
        es.onerror = () => {
            statusText.textContent = 'reconnecting';
            setTimeout(() => { es.close(); connectLogs(); }, 1500);
        };
    }
    connectLogs();

    async function postJSON(url, body) {
        const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        return r.json();
    }

    document.getElementById('ng-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        setBusy(true);
        try {
            await postJSON('/api/download_newgrounds', data);
        } catch (err) {
            addLine('Network error: ' + err.message, 'error');
            setBusy(false);
        }
    });

    document.getElementById('yt-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        setBusy(true);
        try {
            await postJSON('/api/download_youtube', data);
        } catch (err) {
            addLine('Network error: ' + err.message, 'error');
            setBusy(false);
        }
    });

    document.getElementById('shutdown-btn').addEventListener('click', async () => {
        try { await postJSON('/shutdown', {}); } catch (_) {}
        addLine('Server stopped. You can close this tab.', 'warn');
    });
})();
</script>
</body>
</html>
